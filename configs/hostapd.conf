# hostapd - WPA2-Enterprise with Windows NPS (RADIUS)
# Replace all angle-bracket values and use the same random secret in NPS.

interface=wlan0
driver=nl80211
ssid=LAB-RADIUS
hw_mode=g
channel=6
ieee80211n=1

# WPA2-Enterprise / 802.1X
ieee8021x=1
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP

# NPS RADIUS client values
own_ip_addr=<KALI_VMNET_IP>
auth_server_addr=<RADIUS_SERVER_IP>
auth_server_port=1812
auth_server_shared_secret=<REPLACE_WITH_A_LONG_RANDOM_SECRET>

# Optional RADIUS accounting
acct_server_addr=<RADIUS_SERVER_IP>
acct_server_port=1813
acct_server_shared_secret=<REPLACE_WITH_A_LONG_RANDOM_SECRET>

logger_syslog=-1
logger_stdout=-1

