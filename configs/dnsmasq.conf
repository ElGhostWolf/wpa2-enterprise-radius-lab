# dnsmasq - DHCP/DNS for the wireless client subnet only
# Assign wlan0 a static address such as 192.168.60.1/24 first.
# Keep this subnet distinct from the VMnet used to reach NPS.

interface=wlan0
bind-interfaces

# Example Wi-Fi client range (change to match wlan0's subnet)
dhcp-range=192.168.60.100,192.168.60.150,255.255.255.0,24h
dhcp-option=option:router,192.168.60.1
dhcp-option=option:dns-server,192.168.60.1

# Optional: forward DNS to the lab AD DNS server after routing is configured.
# server=<AD_DNS_SERVER_IP>

